name: Build Windows

# La fiecare push se construiește ExamYO.exe (portabil, fără installer) și se publică
# ca artefact. La un tag v* (de ex. v0.1.0) se face și un Release cu arhiva ZIP.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Teste
        run: cargo test --lib

      - name: Build
        run: cargo build --release

      - name: Pregătește arhiva
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ExamYO | Out-Null
          Copy-Item target/release/ExamYO.exe ExamYO/
          Copy-Item packaging/CITESTE.txt ExamYO/
          Copy-Item LICENSE ExamYO/LICENSE.txt
          Compress-Archive -Path ExamYO -DestinationPath ExamYO-windows.zip -Force
          "{0:N1} MB" -f ((Get-Item ExamYO/ExamYO.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ExamYO-windows
          path: ExamYO/

      - name: Release versiune (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ExamYO-windows.zip

      # La fiecare push pe main, Release-ul „ultima-versiune” e refăcut cu exe-ul nou,
      # ca să existe mereu o adresă fixă de descărcare.
      - name: Release „ultima-versiune”
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-versiune --cleanup-tag --yes || true
          gh release create ultima-versiune ExamYO-windows.zip \
            --target "$GITHUB_SHA" \
            --title "ExamYO – ultima versiune" \
            --notes "Construit automat din commit-ul ${GITHUB_SHA::7}. Descarcă ExamYO-windows.zip, dezarhivează și pornește ExamYO.exe. Nu se instalează nimic."
