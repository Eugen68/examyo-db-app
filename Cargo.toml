[package]
name = "examyo"
version = "0.1.1"
edition = "2021"
description = "Antrenament pentru examenul de radioamator YO, cu întrebările lui YO6OWN"
authors = ["Eugen, YO9VA"]
license = "GPL-2.0-or-later"
repository = "https://github.com/Eugen68/examyo-db-app"
build = "build.rs"

[lib]
name = "examyo_core"
path = "src/lib.rs"

[[bin]]
name = "ExamYO"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.33", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "gif", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "ExamYO"
CompanyName = "Eugen, YO9VA"
FileDescription = "ExamYO – pregătire examen radioamator"
LegalCopyright = "Eugen, YO9VA – GPL-2.0-or-later; întrebări © YO6OWN și contributorii"
